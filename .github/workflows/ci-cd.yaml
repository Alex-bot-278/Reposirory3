name: CI/CD Pipeline
on:
  push:
    branches: ["first-iteration-9"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-go@v4
        with:
          go-version: "1.22"
      
      - name: Init Go module
        run: go mod init github.com/yourusername/Reposirory3-1
      
      - name: Install dependencies
        run: go mod tidy
      
      - name: Run tests
        run: go test -v ./...